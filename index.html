<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ede4d1" />
    <meta name="description" content="从古诗词中随机抽取一句，生成一张竖排诗签。" />
    <link rel="icon" href="data:," />
    <title>一笺诗意</title>
    <link rel="stylesheet" href="styles.css?v=13" />
  </head>
  <body>
    <main class="app-shell">
      <section class="draw-stage" aria-label="诗词签卡">
        <article class="sign-card" id="sign-card" aria-label="诗签">
          <div class="sign-card__inner">
            <div class="sign-card__face sign-card__front" id="sign-front">
              <div class="sign-card__grain" aria-hidden="true"></div>
              <div class="verse" id="verse" aria-live="polite"></div>
            </div>
            <section class="sign-card__face sign-card__back" id="sign-back" aria-label="诗签解读" aria-hidden="true" inert>
              <div class="reading" id="reading" tabindex="0">
                <p class="reading__eyebrow">出处</p>
                <h2 id="reading-title"></h2>
                <p class="reading__author" id="reading-author"></p>
                <h3>诗意</h3>
                <p id="reading-meaning"></p>
                <h3 id="reading-original-label">原文</h3>
                <p id="reading-original" class="reading__original"></p>
                <a id="reading-source" target="_blank" rel="noopener noreferrer">查阅原文 ↗</a>
              </div>
            </section>
          </div>
        </article>
      </section>

      <section class="likes" aria-label="诗签点赞">
        <button class="like-button" id="like-button" type="button" aria-pressed="false" aria-label="喜欢这签" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21S3 15.4 3 8.8C3 3.8 9 2.4 12 6c3-3.6 9-2.2 9 2.8C21 15.4 12 21 12 21Z" /></svg>
          <span id="like-count" class="like-count">—</span>
        </button>
        <p id="like-status" class="likes__status" role="status" aria-live="polite"></p>
      </section>

      <section class="controls" aria-label="抽签操作">
        <button class="interpret-button" id="interpret-button" type="button" aria-controls="sign-back" aria-expanded="false">一键解读</button>
        <button class="assistant-button" id="assistant-button" type="button" aria-haspopup="dialog" aria-controls="assistant-dialog">
          <span class="assistant-button__icon" aria-hidden="true">✦</span>
          <span>AI 解签</span>
        </button>
        <button class="draw-button" id="draw-button" type="button">
          <span class="draw-button__mark" aria-hidden="true">签</span>
          <span>再抽一签</span>
        </button>
      </section>
    </main>

    <dialog class="assistant-dialog" id="assistant-dialog" aria-labelledby="assistant-title">
      <div class="assistant-dialog__shell">
        <header class="assistant-dialog__header">
          <div>
            <p class="assistant-dialog__eyebrow">一笺诗意</p>
            <h2 id="assistant-title">解签小助手</h2>
          </div>
          <button class="icon-button" id="assistant-close" type="button" aria-label="关闭解签小助手">×</button>
        </header>

        <div class="assistant-dialog__body">
          <section class="assistant-config" id="assistant-config" aria-labelledby="assistant-config-title">
            <div class="assistant-section-heading">
              <div>
                <h3 id="assistant-config-title">接入你的 API</h3>
                <p>支持 OpenAI 兼容的聊天补全接口，密钥只在你的浏览器中使用。</p>
              </div>
              <button class="text-button" id="assistant-config-cancel" type="button" hidden>收起</button>
            </div>

            <form id="assistant-config-form">
              <label class="field">
                <span>接口地址</span>
                <input id="assistant-endpoint" name="endpoint" type="url" inputmode="url" autocomplete="url" placeholder="https://api.example.com/v1/chat/completions" required />
              </label>
              <div class="assistant-config__row">
                <label class="field">
                  <span>API 密钥</span>
                  <span class="secret-field">
                    <input id="assistant-api-key" name="apiKey" type="password" autocomplete="off" placeholder="sk-…" required />
                    <button class="secret-field__toggle" id="assistant-key-toggle" type="button" aria-label="显示 API 密钥" aria-pressed="false">显示</button>
                  </span>
                </label>
                <label class="field">
                  <span>模型名称</span>
                  <input id="assistant-model" name="model" type="text" autocomplete="off" placeholder="填写服务商提供的模型名" required />
                </label>
              </div>
              <label class="check-field">
                <input id="assistant-remember" name="remember" type="checkbox" />
                <span>在此浏览器中记住配置</span>
              </label>
              <p class="assistant-config__notice">使用共享设备时请勿勾选。接口还需允许浏览器跨域访问。</p>
              <div class="assistant-config__actions">
                <button class="danger-text-button" id="assistant-clear-config" type="button" hidden>清除配置</button>
                <button class="primary-button" type="submit">保存并使用</button>
              </div>
            </form>
          </section>

          <section class="assistant-chat" id="assistant-chat" hidden aria-labelledby="assistant-poem-label">
            <div class="assistant-status-row">
              <span class="connection-status"><span aria-hidden="true"></span>API 已配置</span>
              <button class="text-button" id="assistant-edit-config" type="button">接口设置</button>
            </div>

            <div class="assistant-poem">
              <p id="assistant-poem-label">本次诗签</p>
              <blockquote id="assistant-poem-text"></blockquote>
              <p id="assistant-poem-source"></p>
            </div>

            <label class="field" for="assistant-question">
              <span>你想问什么</span>
              <textarea id="assistant-question" rows="3" maxlength="300" placeholder="例如：这支签对我最近的工作选择有什么启发？"></textarea>
            </label>

            <div class="assistant-answer" id="assistant-answer" aria-live="polite" hidden>
              <div class="assistant-answer__heading">
                <span class="assistant-answer__mark" aria-hidden="true">解</span>
                <h3>小助手解签</h3>
              </div>
              <div id="assistant-answer-content"></div>
            </div>

            <p class="assistant-error" id="assistant-error" role="alert" hidden></p>
            <button class="primary-button assistant-submit" id="assistant-submit" type="button">
              <span class="assistant-submit__idle">开始解签</span>
              <span class="assistant-submit__loading" hidden>正在研读诗意…</span>
            </button>
            <p class="assistant-disclaimer">AI 解读仅供文化娱乐与自我反思，不应替代医疗、法律、财务等专业意见。</p>
          </section>
        </div>
      </div>
    </dialog>

    <script src="interpretations.js?v=9"></script>
    <script src="likes.js?v=3"></script>
    <script src="app.js?v=11"></script>
  </body>
</html>
